        def fix_social_proof_tactics():
            """修復 social-proof-tactics.html 的缺失區塊"""
            file_path = "social-proof-tactics.html"
            if not os.path.exists(file_path):
                print(f"❌ 檔案不存在: {file_path}")
                return
            
            with open(file_path, 'r', encoding='utf-8') as f:
                content = f.read()
            
            # 新增設備追蹤區塊
            if 'id="device-tracking"' not in content:
                insert_point = content.find('</main>')
                if insert_point == -1:
                    insert_point = content.find('<footer>')
                
                if insert_point != -1:
                    device_tracking_section = '''
        <!-- 設備追蹤與用戶屬性分析區塊 -->
