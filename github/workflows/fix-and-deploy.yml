name: 🔧 MetaAd 內部連結自動修復與部署

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fix-links-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 檢出代碼
      uses: actions/checkout@v3
      
    - name: 🔍 檢查並修復內部連結
      run: |
        echo "🔍 開始掃描內部連結問題..."
        
