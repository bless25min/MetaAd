    - name: 📝 驗證連結修復
      run: |
        echo "📝 驗證連結修復結果..."
        
        # 建立驗證腳本
        cat > validate_links.py << 'EOF'
        import re
        import os
        
        def validate_internal_links():
            """驗證內部連結是否正常"""
            files_to_check = [
                "index.html",
                "algorithm-mastery.html", 
                "remarketing-funnel.html",
                "budget-hacks.html",
                "social-proof-tactics.html",
                "white-hat-techniques.html",
                "capi-setup-guide.html"
            ]
            
            broken_links = []
            fixed_links = []
            
            for file_path in files_to_check:
                if os.path.exists(file_path):
                    with open(file_path, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    # 檢查內部錨點連結
                    anchor_links = re.findall(r'href="([^"]*#[^"]*)"', content)
                    
                    for link in anchor_links:
                        if link.startswith('#'):
                            # 內部錨點連結
                            anchor_id = link[1:]
                            if f'id="{anchor_id}"' in content:
                                fixed_links.append(f"{file_path}: {link}")
                            else:
                                broken_links.append(f"{file_path}: {link}")
                        elif '#' in link:
                            # 跨頁面錨點連結
                            page, anchor = link.split('#', 1)
                            if page and os.path.exists(page):
                                with open(page, 'r', encoding='utf-8') as target_file:
                                    target_content = target_file.read()
                                    if f'id="{anchor}"' in target_content:
                                        fixed_links.append(f"{file_path}: {link}")
                                    else:
                                        broken_links.append(f"{file_path}: {link}")
            
            print("✅ 已修復的連結:")
            for link in fixed_links:
                print(f"  ✓ {link}")
            
            if broken_links:
                print("\n⚠️  仍有問題的連結:")
                for link in broken_links:
                    print(f"  ✗ {link}")
                return False
            else:
                print("\n🎉 所有內部連結都已修復！")
                return True
        
        # 執行驗證
        validation_passed = validate_internal_links()
        
        if not validation_passed:
            print("\n❌ 連結驗證失敗，請檢查問題")
            exit(1)
        
        EOF
        
        python3 validate_links.py
        
