    - name: 🚀 自動部署到 GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        exclude_assets: '.github,*.py,*.md,LINK_FIX_REPORT.md'
        
    - name: 📢 部署狀態通知
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "🎉 部署成功！"
          echo "✅ 網站已更新: https://$(echo $GITHUB_REPOSITORY | cut -d'/' -f2).github.io/"
          echo "✅ 所有內部連結已修復"
        else
          echo "❌ 部署失敗，請檢查日誌"
        fi
        
    - name: 💾 提交修復變更
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "🔧 自動修復內部連結 - $(date '+%Y-%m-%d %H:%M:%S')"
        git push
