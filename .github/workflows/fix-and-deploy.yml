#!/bin/bash

echo "🔧 MetaAd 內部連結快速修復"
echo "============================="
echo ""

# 步驟 1: 刪除舊的工作流程文件（如果存在）
echo "🗑️  清理舊的工作流程文件..."
rm -f .github/workflows/fix-and-deploy.yml

# 步驟 2: 重新建立目錄
echo "📁 重新建立目錄..."
mkdir -p .github/workflows

# 步驟 3: 建立正確的工作流程文件
echo "⚙️  建立新的工作流程文件..."
cat > .github/workflows/fix-and-deploy.yml << 'EOF'
name: Fix MetaAd Internal Links

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Fix internal links
      run: |
        echo "Fixing internal links..."
        
        if [ -f "algorithm-mastery.html" ]; then
          echo "Processing algorithm-mastery.html..."
          
          # 備份原文件
          cp algorithm-mastery.html algorithm-mastery.html.backup
          
          # 檢查是否需要添加區塊
          if ! grep -q 'id="industry-data"' algorithm-mastery.html; then
            echo "Adding industry-data section..."
            
            # 創建修復腳本
            cat > fix_links.py << 'PYTHON_EOF'
import re

# 讀取文件
with open('algorithm-mastery.html', 'r', encoding='utf-8') as f:
    content = f.read()

# 新增區塊內容
new_sections = '''
        <section class="content-section" id="industry-data">
            <h2>📊 2024-2025年廣告趨勢與產業數據分析</h2>
            <div class="data-insights">
                <div class="insight-card">
                    <h3>🎯 Meta廣告投放趨勢</h3>
                    <ul>
                        <li><strong>AI自動優化占比提升：</strong>2024年使用Advantage+的廣告主增長78%</li>
                        <li><strong>影片廣告成效領先：</strong>影片廣告的參與度比靜態圖片高出2.3倍</li>
                        <li><strong>行動裝置主導：</strong>92%的廣告預算投放於行動裝置</li>
                        <li><strong>再行銷精準度提升：</strong>CAPI整合後轉換率平均提升35%</li>
                    </ul>
                </div>
                <div class="insight-card">
                    <h3>📈 產業基準數據 (2024Q4)</h3>
                    <table class="benchmark-table">
                        <thead>
                            <tr>
                                <th>產業類別</th>
                                <th>平均CPM</th>
                                <th>平均CPC</th>
                                <th>平均轉換率</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>電商零售</td>
                                <td>$12.50</td>
                                <td>$0.85</td>
                                <td>2.8%</td>
                            </tr>
                            <tr>
                                <td>教育培訓</td>
                                <td>$8.30</td>
                                <td>$0.62</td>
                                <td>4.2%</td>
                            </tr>
                            <tr>
                                <td>金融保險</td>
                                <td>$18.90</td>
                                <td>$1.45</td>
                                <td>1.9%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="content-section" id="fraud-detection">
            <h2>🛡️ 第三方防詐工具整合方案</h2>
            <div class="fraud-detection-tools">
                <div class="tool-card">
                    <h3>🔍 Anura 防詐系統整合</h3>
                    <div class="tool-features">
                        <h4>主要功能：</h4>
                        <ul>
                            <li>即時假帳號偵測與阻擋</li>
                            <li>設備指紋識別技術</li>
                            <li>行為模式異常分析</li>
                            <li>IP地址信譽評估</li>
                        </ul>
                        <h4>整合步驟：</h4>
                        <ol>
                            <li>在Anura平台建立帳戶並取得API金鑰</li>
                            <li>在網站中嵌入Anura追蹤代碼</li>
                            <li>設定Meta Pixel事件與Anura聯動</li>
                            <li>配置即時阻擋規則</li>
                        </ol>
                    </div>
                </div>
                <div class="tool-card">
                    <h3>📱 AppsFlyer 歸因分析</h3>
                    <div class="tool-features">
                        <h4>核心優勢：</h4>
                        <ul>
                            <li>跨平台統一歸因追蹤</li>
                            <li>防詐欺安裝偵測</li>
                            <li>深度連結追蹤</li>
                            <li>LTV預測分析</li>
                        </ul>
                        <h4>與Meta整合：</h4>
                        <ol>
                            <li>透過SDK收集應用內事件</li>
                            <li>使用S2S API回傳轉換數據</li>
                            <li>建立統一的用戶識別系統</li>
                            <li>設定ROI監控儀表板</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>
'''

# 尋找插入點
insert_point = content.find('</main>')
if insert_point == -1:
    insert_point = content.find('<footer>')

if insert_point != -1:
    new_content = content[:insert_point] + new_sections + content[insert_point:]
    
    with open('algorithm-mastery.html', 'w', encoding='utf-8') as f:
        f.write(new_content)
    
    print('SUCCESS: Added sections')
else:
    print('ERROR: Could not find insertion point')

# 添加CSS樣式
if '</style>' in content and 'data-insights' not in content:
    css_styles = '''
        .data-insights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .insight-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid var(--primary-color);
        }
        
        .benchmark-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        
        .benchmark-table th,
        .benchmark-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .benchmark-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        
        .fraud-detection-tools {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .tool-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 4px solid var(--secondary-color);
        }
        
        .tool-features h4 {
            color: var(--primary-color);
            margin: 1.5rem 0 0.8rem 0;
        }
        
        .tool-features ul,
        .tool-features ol {
            margin: 0.8rem 0;
            padding-left: 1.5rem;
        }
        
        .tool-features li {
            margin: 0.5rem 0;
        }
        
        @media (max-width: 768px) {
            .data-insights,
            .fraud-detection-tools {
                grid-template-columns: 1fr;
            }
        }
'''
    
    with open('algorithm-mastery.html', 'r', encoding='utf-8') as f:
        content = f.read()
    
    content = content.replace('</style>', css_styles + '\n        </style>')
    
    with open('algorithm-mastery.html', 'w', encoding='utf-8') as f:
        f.write(content)
    
    print('SUCCESS: Added CSS styles')
PYTHON_EOF
            
            python3 fix_links.py
            
            echo "Section addition completed"
          else
            echo "Sections already exist"
          fi
        else
          echo "algorithm-mastery.html not found"
        fi
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        exclude_assets: '.github,*.py,*.backup'
        
    - name: Report completion
      run: |
        echo "Fix and deployment completed"
        echo "Website: https://metaad.25min.co/"
        echo "Test links:"
        echo "- https://metaad.25min.co/algorithm-mastery.html#industry-data"
        echo "- https://metaad.25min.co/algorithm-mastery.html#fraud-detection"
EOF

echo "✅ 工作流程文件已建立"
echo ""

# 步驟 4: 驗證文件
echo "🔍 驗證 YAML 文件..."
if [ -f ".github/workflows/fix-and-deploy.yml" ]; then
    echo "✅ 文件存在"
    echo "📏 文件大小: $(wc -c < .github/workflows/fix-and-deploy.yml) bytes"
else
    echo "❌ 文件建立失敗"
    exit 1
fi

# 步驟 5: 提交變更
echo "📝 提交變更..."
git add .github/workflows/fix-and-deploy.yml
git commit -m "🔧 修復 GitHub Action YAML 語法錯誤

- 重新建立工作流程文件
- 修正 YAML 格式問題
- 簡化腳本結構
- 確保語法正確性"

echo "✅ 提交完成"
echo ""

# 步驟 6: 推送到 GitHub
echo "🚀 推送到 GitHub..."
git push origin main

echo ""
echo "🎉 修復完成！"
echo "⏳ GitHub Actions 將在幾秒後開始執行..."
echo "🔗 查看狀態: https://github.com/$(git config --get remote.origin.url | sed 's/.*github.com[:/]\([^/]*\/[^/]*\).*/\1/' | sed 's/\.git$//')/actions"
echo ""
echo "🎯 修復完成後請測試:"
echo "- https://metaad.25min.co/algorithm-mastery.html#industry-data"
echo "- https://metaad.25min.co/algorithm-mastery.html#fraud-detection"
